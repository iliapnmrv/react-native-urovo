name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after all checks pass (otherwise only build an artifact)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

# Keep version allocation and publishing in the same queue, including retries.
concurrency:
  group: npm-release-${{ github.repository }}
  queue: max

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write

  build:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft)
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.release.outputs.action }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare release version
        id: release
        env:
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs prepare

      - name: Build package
        if: steps.release.outputs.action == 'publish'
        run: yarn prepare

      - name: Pack
        if: steps.release.outputs.action == 'publish'
        run: npm pack --ignore-scripts --pack-destination .release

      - name: Upload package artifact
        if: steps.release.outputs.action != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ github.run_id }}
          path: .release/*
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  publish:
    if: >-
      needs.build.result == 'success' &&
      needs.build.outputs.action != 'skip' &&
      (github.event_name == 'push' || github.event_name == 'pull_request' || inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package-${{ github.run_id }}
          path: .release

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup npm with Trusted Publishing support
        run: npm install --global "npm@^11.5.1"

      - name: Publish package and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/release.mjs publish
