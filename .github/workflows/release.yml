name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or recover (leave empty for a build preview)
        required: false
        type: string
      publish:
        description: Publish the selected tag after all checks pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.repository }}
  queue: max

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
    permissions:
      contents: write

  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: checks
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download tested package
        uses: actions/download-artifact@v4
        with:
          name: npm-package-${{ github.run_id }}
          path: .release

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup npm with Trusted Publishing support
        run: npm install --global "npm@^11.5.1"

      - name: Publish package and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release.mjs publish
