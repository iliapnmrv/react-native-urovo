name: Release

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm distribution tag
        required: true
        type: choice
        default: beta
        options:
          - beta
          - latest
      publish:
        description: Publish after all checks pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Ensure publishing runs from main
        if: inputs.publish
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Publishing is only allowed from main"
            exit 1
          fi

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test:ci

      - name: Build package
        run: yarn prepare

      - name: Ensure dist-tag matches the package version
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          node -e "const p=require('./package.json'); const pre=p.version.includes('-'); if (process.env.DIST_TAG === 'latest' && pre) throw new Error('A prerelease cannot be published with the latest tag'); if (process.env.DIST_TAG === 'beta' && !pre) throw new Error('A stable version cannot be published with the beta tag')"

      - name: Pack
        run: npm pack --ignore-scripts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: react-native-urovo-*.tgz
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup npm with Trusted Publishing support
        run: npm install --global "npm@^11.5.1"

      - name: Publish to npm
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: npm publish package/react-native-urovo-*.tgz --tag "$DIST_TAG" --registry https://registry.npmjs.org

      - name: Create GitHub tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          if [[ "$VERSION" == *-* ]]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
