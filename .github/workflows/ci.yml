name: CI

on:
  push:
    branches-ignore:
      - main
      - 'feature/**'
      - coverage
  pull_request:
    branches:
      - main
      - 'feature/**'
  merge_group:
    types:
      - checks_requested
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test:ci

      - name: Test release automation
        run: yarn test:release

      - name: Summarize coverage
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: node scripts/coverage.mjs

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: true
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage

      - name: Update coverage badge
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const repository = context.repo;
            const main = await github.rest.repos.getBranch({ ...repository, branch: 'main' });
            if (main.data.commit.sha !== context.sha) {
              core.info('A newer main commit exists; leaving its badge unchanged');
              return;
            }
            let parent;
            try {
              const ref = await github.rest.git.getRef({ ...repository, ref: 'heads/coverage' });
              parent = ref.data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const files = ['coverage.svg', 'metrics.json'];
            const tree = await github.rest.git.createTree({
              ...repository,
              tree: files.map(path => ({
                path,
                mode: '100644',
                type: 'blob',
                content: fs.readFileSync(`coverage/${path}`, 'utf8'),
              })),
            });
            const commit = await github.rest.git.createCommit({
              ...repository,
              message: `Update coverage for ${context.sha}`,
              tree: tree.data.sha,
              parents: parent ? [parent] : [],
            });
            if (parent) {
              await github.rest.git.updateRef({ ...repository, ref: 'heads/coverage', sha: commit.data.sha });
            } else {
              await github.rest.git.createRef({ ...repository, ref: 'refs/heads/coverage', sha: commit.data.sha });
            }

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  build-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        new_architecture: [false, true]
    env:
      TURBO_CACHE_DIR: .turbo/android
      ORG_GRADLE_PROJECT_newArchEnabled: ${{ matrix.new_architecture }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ matrix.new_architecture }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-${{ matrix.new_architecture }}-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ matrix.new_architecture }}-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"
